<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Deudores</title>
</head>
<body>
    <h1>Gestión de Deudores</h1>
    
    <table border="1">
        <thead>
            <tr>
                <th>Nombre Completo</th>
                <th>DNI</th>
                <th>Deuda</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for deudor in deudores %}
            <tr>
                <td>{{ deudor.nombre_completo }}</td>
                <td>{{ deudor.dni }}</td>
                <td>${{ deudor.deuda }}</td>
                <td>{{ deudor.get_estado_display }}</td>
                <td>
                    <a href="{% url 'detalle_deudor' deudor.id %}">Ver detalle</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
