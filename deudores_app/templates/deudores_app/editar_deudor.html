<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Deudor</title>
</head>
<body>
    <h1>Editar Deudor: {{ deudor.nombre_completo }}</h1>
    
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Guardar cambios</button>
        <a href="{% url 'detalle_deudor' deudor.id %}">Cancelar</a>
    </form>
</body>
</html>
